<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        const host = window.location.hostname;

        //Update language attribute based on domain
        if (host.endsWith('.es')) {
          document.documentElement.setAttribute('lang', 'es');
        } else {
          document.documentElement.setAttribute('lang', 'en');
        }

        // Update title and meta tags based on domain
        if (host.endsWith('.es')) {
          document.title = "TicketBrain | Comprende tus gastos y ahorra con inteligencia artificial";

          const metaDesc = document.createElement('meta');
          metaDesc.name = 'description';
          metaDesc.content = 'TicketBrain te ayuda a comprender tus gastos en el supermercado, categorizarlos automáticamente y ahorrar dinero con información impulsada por IA.';
          document.head.appendChild(metaDesc);

          const metaKeywords = document.createElement('meta');
          metaKeywords.name = 'keywords';
          metaKeywords.content = 'ahorro supermercado, análisis de tickets, inteligencia artificial, compras supermercado, TicketBrain, gastos alimentación, compras inteligentes, optimizar compras, finanzas personales';
          document.head.appendChild(metaKeywords);

        } else {
          document.title = "TicketBrain | Understand Your Spending and Save Money with AI";

          const metaDesc = document.createElement('meta');
          metaDesc.name = 'description';
          metaDesc.content = 'TicketBrain helps you understand your supermarket spending, categorize it automatically, and save money with AI-powered insights.';
          document.head.appendChild(metaDesc);

          const metaKeywords = document.createElement('meta');
          metaKeywords.name = 'keywords';
          metaKeywords.content = 'grocery savings, supermarket, receipt analysis, AI shopping, insights, TicketBrain, food expenses, smart shopping, optimize groceries';
          document.head.appendChild(metaKeywords);
        }
      })();
    </script>
    <meta name="robots" content="index, follow">
    <meta name="author" content="TicketBrain" />

    <link rel="alternate" href="https://ticketbrain.app/" hreflang="en" />
    <link rel="alternate" href="https://ticketbrain.es/" hreflang="es" />
    <link rel="alternate" href="https://ticketbrain.app/" hreflang="x-default" />

    <meta property="og:title" content="TicketBrain - Turn Receipts Into Smart Insights" />
    <meta property="og:description" content="Transform grocery receipts into powerful insights about to save money" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ticketbrain.app/" />
    <meta property="og:image" content="https://ticketbrain.app/sharing-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TicketBrain – Turn Receipts Into Smart Insights" />
    <meta name="twitter:site" content="TicketBrain" />
    <meta name="twitter:image" content="https://ticketbrain.app/sharing-image.png" />
    <link rel="icon" href="https://ticketbrain.app/fav-icon.png" type="image/png">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
